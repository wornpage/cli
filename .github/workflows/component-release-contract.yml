name: Component release contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install component dependencies
        run: bun install --frozen-lockfile

      - name: Check out shared verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-contract

      - name: Install verifier dependencies
        run: bun install --frozen-lockfile --cwd .release-contract

      - name: Verify source and delivery artifacts
        run: bun run .release-contract/src/index.ts verify . --frozen-dist
